<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", system-ui, sans-serif; color: #14171f; background: #ffffff; }
  </style>
</helmet>

<div style="width: 1280px; height: 760px; display: flex; gap: 40px; padding: 40px; background: #f1f3f7;">

  <!-- STATE 1 — closed: a launcher bubble, not a page navigation -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 12.5px; font-weight: 700; color: #767d8c; text-transform: uppercase; letter-spacing: 0.04em;">Closed — launcher only</div>
    <div style="position: relative; flex: 1; border-radius: 14px; overflow: hidden; background: #ffffff; box-shadow: 0 1px 3px rgba(20,23,31,0.08);">

      <!-- Simplified portal chrome behind the widget -->
      <div style="height: 60px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #e4e7ec; padding: 0 28px;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="width: 26px; height: 26px; border-radius: 7px; background: #14171f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">AZ</div>
          <span style="font-size: 13.5px; font-weight: 700;">AZM Squad</span>
          <span style="font-size: 12px; color: #767d8c;">Support</span>
        </div>
        <div style="flex: 1;"></div>
        <div style="width: 60px; height: 12px; border-radius: 6px; background: #eef0f4;"></div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #eef0fe;"></div>
      </div>

      <div style="padding: 28px; display: flex; flex-direction: column; gap: 14px;">
        <div style="height: 22px; width: 55%; border-radius: 6px; background: #eef0f4;"></div>
        <div style="height: 14px; width: 75%; border-radius: 6px; background: #f1f3f7;"></div>
        <div style="margin-top: 10px; display: flex; gap: 14px;">
          <div style="flex: 1; height: 96px; border-radius: 10px; background: #f7f8fa; border: 1px solid #e4e7ec;"></div>
          <div style="flex: 1; height: 96px; border-radius: 10px; background: #f7f8fa; border: 1px solid #e4e7ec;"></div>
          <div style="flex: 1; height: 96px; border-radius: 10px; background: #f7f8fa; border: 1px solid #e4e7ec;"></div>
        </div>
      </div>

      <!-- The launcher: fixed to a bottom corner, layered over whatever page the
           customer is on — not a route change. Violet reuses the existing "chat"
           channel accent so it reads as the same feature, just always-available. -->
      <div style="position: absolute; inset-inline-end: 24px; bottom: 24px; width: 56px; height: 56px; border-radius: 999px; background: #6b3fc4; box-shadow: 0 8px 20px rgba(107,63,196,0.35); display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span style="position: absolute; top: -3px; inset-inline-end: -3px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: #c62828; color: #ffffff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #ffffff;">1</span>
      </div>

    </div>
  </div>

  <!-- STATE 2 — open: a compact panel over the same page, not a new page -->
  <div style="flex: 1; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 12.5px; font-weight: 700; color: #767d8c; text-transform: uppercase; letter-spacing: 0.04em;">Open — chat panel</div>
    <div style="position: relative; flex: 1; border-radius: 14px; overflow: hidden; background: #ffffff; box-shadow: 0 1px 3px rgba(20,23,31,0.08);">

      <div style="height: 60px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid #e4e7ec; padding: 0 28px;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="width: 26px; height: 26px; border-radius: 7px; background: #14171f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">AZ</div>
          <span style="font-size: 13.5px; font-weight: 700;">AZM Squad</span>
          <span style="font-size: 12px; color: #767d8c;">Support</span>
        </div>
        <div style="flex: 1;"></div>
        <div style="width: 60px; height: 12px; border-radius: 6px; background: #eef0f4;"></div>
        <div style="width: 28px; height: 28px; border-radius: 999px; background: #eef0fe;"></div>
      </div>

      <div style="padding: 28px; display: flex; flex-direction: column; gap: 14px; filter: blur(1.5px); opacity: 0.5;">
        <div style="height: 22px; width: 55%; border-radius: 6px; background: #eef0f4;"></div>
        <div style="height: 14px; width: 75%; border-radius: 6px; background: #f1f3f7;"></div>
      </div>

      <!-- The panel itself: ~360x520, anchored bottom-corner, floating over the
           page behind it (scrim implied by the dimmed content above). -->
      <div style="position: absolute; inset-inline-end: 20px; bottom: 20px; width: 360px; height: 520px; border-radius: 16px; background: #ffffff; box-shadow: 0 16px 40px rgba(20,23,31,0.22); display: flex; flex-direction: column; overflow: hidden;">

        <div style="flex: none; background: #14171f; padding: 16px 16px 14px; display: flex; align-items: flex-start; gap: 10px;">
          <div style="flex: none; width: 34px; height: 34px; border-radius: 999px; background: #6b3fc4; display: flex; align-items: center; justify-content: center;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </div>
          <div style="flex: 1; min-width: 0; padding-top: 2px;">
            <div style="font-size: 14px; font-weight: 700; color: #ffffff;">Live support</div>
            <div style="margin-top: 2px; display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: rgba(255,255,255,0.65);">
              <span style="width: 6px; height: 6px; border-radius: 999px; background: #22c55e;"></span>
              Usually replies in a few minutes
            </div>
          </div>
          <div style="flex: none; display: flex; gap: 4px; padding-top: 2px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </div>
        </div>

        <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #f7f8fa;">

          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px;">
            <div style="max-width: 240px; padding: 9px 12px; border-radius: 10px; border-end-start-radius: 3px; background: #f1f3f7; color: #14171f; font-size: 13px; line-height: 1.5;">Hi! How can we help today?</div>
            <span style="font-size: 10px; color: #9aa1ad; padding-inline-start: 3px;">Just now</span>
          </div>

          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 3px;">
            <div style="max-width: 240px; padding: 9px 12px; border-radius: 10px; border-end-end-radius: 3px; background: #14171f; color: #ffffff; font-size: 13px; line-height: 1.5;">Hi, I can't find where to update my billing address.</div>
            <span style="font-size: 10px; color: #9aa1ad; padding-inline-end: 3px;">Just now</span>
          </div>

        </div>

        <div style="flex: none; padding: 12px; border-top: 1px solid #e4e7ec; background: #ffffff; display: flex; align-items: center; gap: 8px;">
          <div style="flex: 1; height: 38px; border-radius: 10px; border: 1px solid #e4e7ec; background: #f7f8fa; display: flex; align-items: center; padding: 0 12px;">
            <span style="font-size: 12.5px; color: #9aa1ad;">Type a message…</span>
          </div>
          <div style="flex: none; width: 38px; height: 38px; border-radius: 10px; background: #4f46e5; display: flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </div>
        </div>

      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
